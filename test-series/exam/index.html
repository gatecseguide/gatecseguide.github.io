<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATE Guide Test Series</title>
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="MD ANISH AHAMAD">
<link rel="icon" href="/assets/icon-192.png" sizes="192x192" type="image/png"><link rel="icon" href="/assets/icon-48.png" sizes="48x48" type="image/png"><link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#10203a">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light;--ink:#10203a;--ink-2:#3b4a63;--ink-3:#5d6a82;--line:#d3dae6;--bg:#fff;--soft:#f3f6fa;
--blue:#0b57b0;--blue-2:#1f6fd1;--nv:#eceff3;--na:#d9411e;--a:#23893a;--m:#6a3fb0;--warn:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,"Helvetica Neue",Helvetica,sans-serif}
body.in-exam{overflow:hidden}
[hidden]{display:none!important}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 16px;border-radius:6px;
border:1px solid #9aa6b8;background:#fff;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.btn.pri:hover{background:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.pq:focus-visible,.opt input:focus-visible+.ol,.tabs button:focus-visible,.kp button:focus-visible,.calc button:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
code{font:500 .9em Consolas,"IBM Plex Mono",monospace;background:var(--soft);padding:1px 5px;border-radius:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.small{font-size:.9rem;color:var(--ink-3)}
.err{color:var(--warn);min-height:1.2em;margin:4px 0}

/* ordinary pages: access, list, instructions, result */
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--ink);color:#fff}
.pbar b{font-size:1rem;letter-spacing:.02em;white-space:nowrap}
.pbar a{color:#cfe0ff;font-size:.9rem;white-space:nowrap}
@media (max-width:420px){.pbar b{font-size:.9rem}.pbar a{font-size:.8rem}}
.pwrap{max-width:900px;margin:0 auto;padding:22px 16px 60px;outline:0}
.pwrap h1{font-size:clamp(1.45rem,4vw,1.9rem);line-height:1.2;margin:6px 0 10px}
.pwrap h2{font-size:1.2rem;margin:28px 0 10px}
.pwrap h3{font-size:1.02rem;margin:20px 0 6px}
.crumbs{color:var(--ink-3);font-size:.9rem;margin:0}
.lead{font-size:1.06rem;color:var(--ink-2)}
.pform{display:grid;gap:8px;max-width:440px;margin:18px 0}
.pform label{font-weight:700}
.pform input{width:100%;padding:12px 13px;font:500 1rem Consolas,monospace;border:1px solid #9aa6b8;border-radius:6px}
.banner{background:#fff6e0;border:1px solid #f0d48a;border-radius:8px;padding:10px 14px;margin:12px 0}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.94rem}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tl td.acts{white-space:nowrap;text-align:right}
.tl .acts .btn{min-height:38px;padding:7px 12px;margin:2px 0 2px 6px}
.tl .sub{display:block;font-size:.85rem;color:var(--ink-3)}
.soon{font-size:.85rem;color:var(--ink-3);font-weight:700}
@media (max-width:600px){.tl td.acts{white-space:normal;text-align:left}.tl .acts .btn{margin:4px 6px 0 0}
.tl thead{display:none}.tl tr{display:grid;grid-template-columns:44px 1fr;padding:6px 0;border-bottom:1px solid var(--line)}
.tl td{border:0!important}.tl td.acts{grid-column:1/-1}}
.instr{padding-left:22px}
.instr li{margin:7px 0;color:var(--ink-2)}
.lgd{list-style:none;padding:0;margin:8px 0}
.lgd li{display:flex;gap:12px;align-items:center;margin:8px 0}
.decl{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:12px 14px;margin:20px 0}
.decl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.decl input{width:20px;height:20px;margin-top:2px;flex:none}

/* palette symbols (also used in the legend and the instructions) */
.pq{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:36px;padding:0;flex:none;
font:700 14px/1 Arial,sans-serif;border:1px solid #9aa3b0;background:var(--nv);color:#222;border-radius:4px;cursor:pointer}
.pq.st-na{background:var(--na);border-color:#b2330f;color:#fff;border-radius:4px 4px 50% 50%/4px 4px 38% 38%}
.pq.st-a{background:var(--a);border-color:#1b6c2d;color:#fff;border-radius:50% 50% 4px 4px/38% 38% 4px 4px}
.pq.st-m,.pq.st-am{background:var(--m);border-color:#552f93;color:#fff;border-radius:50%;width:38px;height:38px}
.pq.st-am::after{content:"\2713";position:absolute;right:-5px;bottom:-4px;width:17px;height:17px;border-radius:50%;
background:var(--a);border:1.5px solid #fff;color:#fff;font-size:10px;line-height:15px;text-align:center}
span.pq{cursor:default}
.pq.cur{box-shadow:0 0 0 3px #f2a900}

/* the exam screen */
.exam{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff}
.etop{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--ink);color:#fff;min-height:52px}
.etitle{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etools{display:flex;gap:6px}
.etools button{border:1px solid #6d7d99;background:#1b2f52;color:#fff;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:.88rem;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.etools button:hover{background:#25406c}
.etime{background:#fff;color:var(--ink);border-radius:6px;padding:5px 10px;white-space:nowrap;font-size:.86rem}
.etime b{font:700 1.08rem/1 Consolas,"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;margin-left:4px}
.etime.warn{background:#ffe1da;color:var(--warn)}
.esec{display:flex;align-items:stretch;gap:8px;border-bottom:1px solid #c5cfdf;background:#e9eef6;padding:0 8px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 14px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:pointer;font-size:.93rem}
.tabs button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
.palbtn{display:none;align-self:center;border:1px solid #9aa6b8;background:#fff;border-radius:5px;padding:6px 10px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap;min-height:36px}
.ebody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px}
.qpane{display:flex;flex-direction:column;min-height:0;border-right:1px solid #c5cfdf}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding:8px 16px;border-bottom:1px solid var(--line);background:#fafbfd}
.qno{font-size:1.05rem;margin:0}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--ink-2)}
.qmeta .plus{color:var(--a)}.qmeta .minus{color:var(--warn)}
.qscroll{flex:1;overflow:auto;padding:16px 18px 28px;-webkit-overflow-scrolling:touch}
.qact{display:flex;flex-wrap:wrap;gap:8px;padding:9px 12px;border-top:1px solid #c5cfdf;background:#f2f5f9}
.qact .btn{min-height:42px}
.qact .pri{margin-left:auto}
.side{display:flex;flex-direction:column;min-height:0;background:#f5f8fc}
.cand{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.cand svg{width:46px;height:46px;flex:none;border:1px solid var(--line);border-radius:4px;background:#eef2f7}
.cand span{display:block;font-size:.78rem;color:var(--ink-3)}
.cand b{display:block;font-size:.92rem;word-break:break-all}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.8rem;line-height:1.2}
.legend .lg{display:flex;gap:8px;align-items:center}
.legend .lg:last-child{grid-column:1/-1}
.legend .pq{width:34px;height:30px;font-size:12px}
.legend .pq.st-m,.legend .pq.st-am{width:32px;height:32px}
.palhead{padding:8px 12px 0;font-weight:700;font-size:.9rem;color:var(--blue)}
.palhint{padding:0 12px;font-size:.78rem;color:var(--ink-3)}
.pal{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:12px 6px;padding:10px 12px 16px;align-content:start;justify-items:center}
.sidefoot{padding:10px 12px;border-top:1px solid var(--line);background:#fff;display:grid;gap:8px}
.sidefoot .btn{width:100%}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:35}
@media (max-width:900px){
 .ebody{grid-template-columns:minmax(0,1fr)}
 .qpane{border-right:0}
 .palbtn{display:inline-flex;align-items:center;gap:6px}
 .side{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);z-index:40;transform:translateX(105%);transition:transform .18s ease;box-shadow:-8px 0 24px rgba(0,0,0,.25);visibility:hidden}
 .side.open{transform:none;visibility:visible}
 .qact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .qact .pri{grid-column:1/-1;margin:0}
 .qact .btn{padding:8px 8px;font-size:.92rem}
}
@media (max-width:560px){
 .etop{flex-wrap:wrap;gap:6px 8px;padding:6px 10px}
 .etitle{flex-basis:100%;font-size:.92rem}
 .etools{flex:1}
 .etools button{padding:5px 8px;font-size:.82rem}
 .qscroll{padding:12px 12px 24px}
 .qhead{padding:7px 12px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* question content */
.md{overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md pre{background:#f6f8fb;border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font-size:.9rem;line-height:1.45}
.md pre code{background:none;padding:0;white-space:pre;font-size:.92rem}
.md .tbl{display:inline-block;max-width:100%;vertical-align:top}
.md .tbl table{width:auto;min-width:0}
.md .mdisp{display:block;overflow-x:auto;overflow-y:hidden;padding:2px 0;margin:6px 0}
.md .katex{font-size:1.08em}
.katex{position:relative}
.fig{margin:10px 0 14px;overflow-x:auto}
.fig svg{max-width:100%;height:auto;background:#fff}
.opts{border:0;margin:14px 0 0;padding:0;display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:#fff}
.opt:hover{border-color:#9aa6b8;background:#fbfcfe}
.opt input{width:19px;height:19px;margin:2px 0 0;flex:none;accent-color:var(--blue-2)}
.opt .ol{font-weight:700;min-width:1.2em}
.opt .ot{flex:1;min-width:0}
.opt .ot p:last-child{margin:0}
.opt:has(input:checked){border-color:var(--blue-2);background:#eef4ff}
.nat{margin-top:16px;max-width:260px}
.natbox{min-height:44px;border:1px solid #7d889a;border-radius:4px;padding:9px 10px;font:600 1.15rem/1.3 Consolas,monospace;background:#fff;white-space:pre;overflow:hidden;cursor:default}
.natbox .caret{display:inline-block;width:2px;height:1.15em;background:var(--ink);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.natbox .caret{animation:none}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;padding:8px;border:1px solid #c3cbd8;border-radius:6px;background:#eef1f5}
.kp button{min-height:44px;border:1px solid #9aa3b0;border-radius:4px;background:#fff;font:700 1.05rem Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.kp button:active{background:#dfe6f1}
.kp .wide{grid-column:1/-1;font-size:.95rem}
.kp .sm{font-size:.86rem;white-space:nowrap}
.natnote{font-size:.8rem;color:var(--ink-3);margin:6px 0 0}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.ovbox{background:#fff;border-radius:8px;max-width:820px;width:100%;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35);margin:auto 0}
.ovbox h2{margin:0 0 10px;font-size:1.25rem}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:.9rem;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* calculator */
.calc{position:fixed;z-index:60;top:64px;left:calc(50% - 170px);width:340px;max-width:calc(100vw - 12px);background:#dfe4ec;border:1px solid #7f8ba0;border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
.calc .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;background:var(--ink);color:#fff;border-radius:7px 7px 0 0;cursor:move;touch-action:none;font-weight:700;font-size:.9rem}
.calc .ch button{border:0;background:#2b4067;color:#fff;border-radius:4px;width:32px;height:30px;cursor:pointer;font-size:1.1rem}
.calc .cd{margin:8px;background:#fff;border:1px solid #8f9aae;border-radius:4px;padding:6px 8px;text-align:right;font-family:Consolas,monospace}
.calc .cx{min-height:1.3em;font-size:.86rem;color:var(--ink-3);overflow-x:auto;white-space:nowrap}
.calc .cv{font-size:1.45rem;font-weight:700;min-height:1.4em;overflow-x:auto;white-space:nowrap}
.calc .cm{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-3)}
.calc .cg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 8px 8px}
.calc .cg button{min-height:36px;border:1px solid #9aa3b0;border-radius:4px;background:#fff;font:600 .86rem Arial,sans-serif;cursor:pointer;padding:0 2px;touch-action:manipulation}
.calc .cg button:active{background:#d5deeb}
.calc .cg .f{background:#f1f4f8}
.calc .cg .o{background:#e7ecf4}
.calc .cg .c{background:#fbe3dc;color:#8d230f}
.calc .cg .eq{background:var(--blue-2);color:#fff;border-color:var(--blue-2)}
.calc .cg .s2{grid-column:span 2}
.calc .cg .on{background:var(--ink);color:#fff}

/* result */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft)}
.kpi span{display:block;font-size:.8rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-size:1.45rem;line-height:1.2}
.kpi i{font-style:normal;font-size:.85rem;color:var(--ink-3)}
.kpi.big{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.big span,.kpi.big i{color:#c9d5ea}
.kpi.ok b{color:var(--a)}.kpi.bad b{color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.filters button{border:1px solid #9aa6b8;background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;min-height:38px}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rq{border:1px solid var(--line);border-left:6px solid #9aa6b8;border-radius:8px;padding:12px 14px;margin:0 0 14px;background:#fff}
.rq.correct{border-left-color:var(--a)}.rq.wrong{border-left-color:var(--warn)}.rq.unattempted{border-left-color:#9aa6b8}
.rqh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:.86rem;color:var(--ink-3);margin-bottom:8px}
.rqh b{color:var(--ink);font-size:1rem}
.badge{font-weight:700;font-size:.8rem;padding:3px 9px;border-radius:999px;margin-left:auto}
.badge.correct{background:#e3f4e6;color:#17642a}.badge.wrong{background:#fde6e1;color:#9d2512}.badge.unattempted{background:#eceff3;color:#4a5568}
.ropts{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.ropts li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ropts li.key{border-color:var(--a);background:#f0faf2}
.ropts li.you:not(.key){border-color:var(--warn);background:#fff3f0}
.ropts .ol{font-weight:700}
.ropts .ot{flex:1;min-width:0}.ropts .ot p:last-child{margin:0}
.ropts .tag{font-size:.75rem;font-weight:700;white-space:nowrap}
.ropts li.key .tag{color:#17642a}.ropts li.you:not(.key) .tag{color:#9d2512}
.ans{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.93rem;margin:8px 0;padding:8px 10px;background:var(--soft);border-radius:6px}
.sol{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.sol summary{cursor:pointer;font-weight:700;color:var(--blue);min-height:36px;display:flex;align-items:center}
@media print{.etop,.esec,.qact,.side,.filters,.pbar{display:none}}
</style>
</head>
<body>
<noscript><p style="padding:16px">The test series needs JavaScript. Please turn it on and reload this page.</p></noscript>
<div id="v-page" class="view">
  <header class="pbar"><b>GATE GUIDE · Test Series</b><a href="/test-series/">About the test series</a></header>
  <main id="page" class="pwrap" tabindex="-1"><p class="lead">Loading…</p></main>
</div>
<div id="v-exam" class="exam" hidden>
  <header class="etop">
    <div class="etitle" id="etitle"></div>
    <div class="etools">
      <button type="button" id="b-calc" aria-expanded="false" aria-controls="calc"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x=".75" y=".75" width="12.5" height="14.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="3" width="8" height="3" fill="currentColor"/><g fill="currentColor"><circle cx="4" cy="9" r="1"/><circle cx="7" cy="9" r="1"/><circle cx="10" cy="9" r="1"/><circle cx="4" cy="12.2" r="1"/><circle cx="7" cy="12.2" r="1"/><circle cx="10" cy="12.2" r="1"/></g></svg>Calculator</button>
      <button type="button" id="b-instr">Instructions</button>
    </div>
    <div class="etime" id="etime" role="timer" aria-label="Time left">Time Left <b id="timer">--:--</b></div>
  </header>
  <div class="esec">
    <div class="tabs" id="tabs" role="tablist" aria-label="Sections"></div>
    <button type="button" class="palbtn" id="b-pal" aria-controls="side" aria-expanded="false">Palette <span id="palcount"></span></button>
  </div>
  <div class="ebody">
    <section class="qpane" aria-label="Question">
      <div class="qhead" id="qhead"></div>

/* ------------------------------------------------------------ Markdown + KaTeX */
function libs() { return typeof window.marked !== "undefined" && typeof window.DOMPurify !== "undefined"; }
function tex(t, display) {
  if (typeof window.katex === "undefined") return esc(display ? "$$" + t + "$$" : "$" + t + "$");
  try {
    var h = katex.renderToString(t, {displayMode: display, throwOnError: false, output: "htmlAndMathml"});
    return display ? '<span class="mdisp">' + h + "</span>" : h;
  } catch (e) { return esc(t); }
}
function md(src, inline) {
  src = String(src == null ? "" : src);
  if (!libs()) return '<span style="white-space:pre-wrap">' + esc(src) + "</span>";
  var codes = [], maths = [];
  function keep(m) { codes.push(m); return "\u0001" + (codes.length - 1) + "\u0001"; }
  src = src.replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, keep).replace(/`[^`\n]*`/g, keep);
  src = src.replace(/\\\$/g, "KXDOLLARKX");
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function (m, t) { maths.push([t, true]); return "KXMATH" + (maths.length - 1) + "KX"; });
  src = src.replace(/\$([^$\n]+?)\$/g, function (m, t) { maths.push([t, false]); return "KXMATH" + (maths.length - 1) + "KX"; });
  src = src.replace(/\u0001(\d+)\u0001/g, function (m, i) { return codes[+i]; });
  var h = inline ? marked.parseInline(src, {gfm: true}) : marked.parse(src, {gfm: true});
  h = DOMPurify.sanitize(h);
  h = h.replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
  h = h.replace(/KXMATH(\d+)KX/g, function (m, i) { var x = maths[+i]; return x ? tex(x[0], x[1]) : m; });
  return h.replace(/KXDOLLARKX/g, function () { return "$"; });
}
function svgSafe(s) {
  if (!s || typeof window.DOMPurify === "undefined") return "";
  return DOMPurify.sanitize(String(s), {USE_PROFILES: {svg: true, svgFilters: true}});
}

/* ------------------------------------------------------------ instructions */
function sectionsOf(qs) {

    var s = q.section || (q.n <= 10 ? GA : TECH), o = out.filter(function (x) { return x.name === s; })[0];

}

/* ------------------------------------------------------------ the exam */
var S = null, QS = [], SECS = [], draft = null, caret = 0, ticker = null;

function prepare(test) {
  QS = (test.questions || []).slice().sort(function (a, b) { return a.n - b.n; });
  QS.forEach(function (q) { q.section = q.section || (q.n <= 10 ? GA : TECH); });
  SECS = [];
  QS.forEach(function (q) { if (SECS.indexOf(q.section) < 0) SECS.push(q.section); });
}
function beginExam(test) {
  prepare(test);
  S = {v: 1, who: who(), n: Number(test.number) || 0, title: test.title || "Mock test", start: Date.now(),
       dur: Math.round((Number(test.duration_min) || 180) * 60), cur: 0, st: {}, ans: {}, last: {}, paper: test, phase: "exam"};
  QS.forEach(function (q) { S.st[q.n] = "nv"; });
  var ok = lsSet(pkey(S.who, S.n), S);
  lsSet(ACTIVE, {who: S.who, n: S.n});
  enterExam();
  if (!ok) toast("This browser is not saving progress. Do not reload the page during the test.");
}
function resume(s) {
  S = s; prepare(s.paper);

}
